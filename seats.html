<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>龙虎榜席位</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&family=Noto+Sans+SC:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="assets/style.css">
<style>
  .filters{display:flex; flex-wrap:wrap; gap:6px; margin:4px 0 14px;}
  .filters button{font-size:12.5px; padding:6px 12px; border:1px solid var(--line); border-radius:2px;
    background:var(--panel); color:var(--ink-2); cursor:pointer;}
  .filters button.on{background:var(--accent); border-color:var(--accent); color:#fff;}
  .flab{font-size:12px; color:var(--ink-3); align-self:center; margin-right:4px; min-width:3.2em;}
  table.t{width:100%; border-collapse:collapse; font-size:13px;}
  table.t th,table.t td{padding:8px 9px; border-bottom:1px solid var(--line-soft); text-align:left; white-space:nowrap;}
  table.t th{font-size:11.5px; color:var(--ink-3); font-weight:500; cursor:pointer;}
  td.num,th.num{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; text-align:right;}
  .down{color:var(--red);} .up{color:var(--green);}
  table.t td:nth-child(1),table.t td:nth-child(2){white-space:nowrap;}
  table.t td:nth-child(2){min-width:5.5em;}
  .tblwrap{overflow-x:auto;}
  .empty{font-size:13px;color:var(--ink-3);}
  .seatname{cursor:pointer; color:var(--ink);}
  .seatname:hover{color:var(--accent);}
  .det{background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:12px 14px; margin:6px 0 14px;}
  .det h4{margin:0 0 8px; font-size:13.5px;}
  .det a{color:var(--accent); text-decoration:none;}
  .topbar .tnav{display:flex; gap:14px; flex:none;}
  .topbar .tnav a{margin-left:0;}
  @media (max-width:640px){
    .topbar{flex-wrap:wrap; row-gap:8px;}
    .topbar .brand{order:1;}
    .topbar .tnav{order:2; margin-left:auto; gap:12px;}
    .topbar .mini{order:3; flex-basis:100%;}
    .topbar .tnav a{font-size:12.5px;}
  }

  .stat{display:flex; align-items:center; gap:7px; padding:5px 11px; flex:none;
    background:var(--line-soft); border:1px solid var(--line); border-radius:999px;
    font-size:11.5px; color:var(--ink-3); line-height:1.5; white-space:nowrap;}
  .stat b{color:var(--ink); font-weight:500; font-family:"IBM Plex Mono",monospace;}
  .stat .dot{width:7px; height:7px; border-radius:50%; background:var(--green); flex:none;}
  @media (max-width:640px){
    .stat{order:4; flex-basis:100%; justify-content:center; border-radius:6px;}
  }

  .loading{display:flex; align-items:center; gap:10px; padding:18px 2px; color:var(--ink-3); font-size:13px;}
  .loading .sp{width:14px; height:14px; border:2px solid var(--line); border-top-color:var(--accent);
    border-radius:50%; animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion: reduce){ .loading .sp{animation:none;} }
  @media (max-width:900px){ .stat .nx{display:none;} }
  .topbar .mini input{min-width:80px;}
</style>
</head>
<body>
<div class="topbar">
  <a class="brand" href="index.html">Signal</a>
  <div class="mini"><input id="mq" placeholder="输入代码或名字" aria-label="跳转到某只票"></div>
  <nav class="tnav"><a href="ledger.html">台账</a><a href="pool.html">机构池</a><a href="tag.html">标签</a><a href="https://github.com/wwfemg/signal/issues/new?template=feedback.yml" target="_blank">提建议</a></nav>
</div>
<div class="wrap">
  <header class="top">
    <h1>龙虎榜席位</h1>
    <p class="sub" id="sub">把每个席位当成一个操作者来看：上榜多少次、买了多少、买入之后 1／5／10 个交易日平均涨跌多少、有多少次是涨的。</p>
    <p class="note">默认只看上榜 10 次以上的席位——次数太少算出来的胜率没意义。想看全部点“次数：全部”。</p>
  <p class="warn"><b>看的是统计倾向，不是预测。</b>龙虎榜是结果不是预告，它只告诉你昨天谁买了。一个营业部席位背后可能有好几拨人，也可能换了人；“机构专用”不具名，只知道是机构，不知道是谁。胜率按买入日之后 5 个交易日的复权涨跌算，样本次数一并列出，次数少的别当回事。</p>
    <div class="score" id="sum"></div>
    <p class="note" id="sumnote"></p>
    <div class="filters" id="ft"></div>
    <div class="filters" id="fs"></div>
  </header>
  <div id="out"><div class="loading"><span class="sp"></span>正在读取数据…</div></div>
  <footer>数据来自东方财富龙虎榜公开接口。<b>研究记录，不构成投资建议。</b></footer>
</div>
<script>
const esc=s=>String(s??'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
let S=[], ft='营业部', sort='n', minN='上榜≥10次';
const MIN={'全部':0,'上榜≥10次':10,'上榜≥30次':30,'上榜≥60次':60};
function chips(id,list,cur,label,pick){
  const b=document.getElementById(id);
  b.innerHTML=`<span class="flab">${label}</span>`+list.map(x=>`<button data-x="${esc(x)}" class="${x===cur?'on':''}">${esc(x)}</button>`).join('');
  b.querySelectorAll('button').forEach(e=>e.onclick=()=>pick(e.dataset.x));
}
function paint(){
  chips('ft',['营业部','机构专用','北向','全部'],ft,'类型',v=>{ft=v;paint();});
  chips('fs',Object.keys(MIN),minN,'次数',v=>{minN=v;paint();});
  let rows=S.filter(s=>(ft==='全部'||s.type===ft)&&s.n>=MIN[minN]);
  rows.sort((a,b)=>sort==='n'?b.n-a.n:sort==='buy'?b.buy_yi-a.buy_yi:sort==='net'?b.net_yi-a.net_yi:
    sort==='win5'?((b.win5??-1)-(a.win5??-1)):((b[sort]??-99)-(a[sort]??-99)));
  document.getElementById('out').innerHTML = rows.length?`<section><p class="note">共 ${rows.length} 个席位，点名字看它最近买过什么。点表头换排序。</p>
    <div class="tblwrap"><table class="t"><thead><tr><th>席位</th><th class="num" data-s="n">上榜次数</th>
      <th class="num" data-s="buy">买入(亿)</th><th class="num" data-s="net">净买入(亿)</th>
      <th class="num" data-s="d1">次日均涨</th><th class="num" data-s="d5">5日均涨</th>
      <th class="num" data-s="d10">10日均涨</th><th class="num" data-s="win5">5日胜率</th></tr></thead><tbody>`+
    rows.slice(0,200).map((s,i)=>`<tr data-i="${i}"><td class="seatname">${esc(s.name)}</td>
      <td class="num">${s.n}</td><td class="num">${s.buy_yi}</td>
      <td class="num ${s.net_yi<0?'down':'up'}">${s.net_yi}</td>
      <td class="num ${(s.d1??0)<0?'down':'up'}">${s.d1??'—'}%</td>
      <td class="num ${(s.d5??0)<0?'down':'up'}">${s.d5??'—'}%</td>
      <td class="num ${(s.d10??0)<0?'down':'up'}">${s.d10??'—'}%</td>
      <td class="num">${s.win5??'—'}%<span style="color:var(--ink-3);font-size:11px">/${s.n_perf}</span></td></tr>
      <tr class="detrow" data-d="${i}" hidden><td colspan="8"><div class="det"><h4>最近买入</h4>${
        (s.recent||[]).map(r=>`<div>${esc(r.date)}　<a href="stock.html#${r.code}">${esc(r.name||r.code)}</a>　净 ${r.net} 万　买后5日 ${r.d5??'—'}%</div>`).join('')||'—'
      }</div></td></tr>`).join('')+
    `</tbody></table></div>${rows.length>200?'<p class="note">只显示前 200 个</p>':''}</section>`
    :'<section><p class="empty">席位数据还在生成中</p></section>';
  document.querySelectorAll('th[data-s]').forEach(th=>th.onclick=()=>{sort=th.dataset.s;paint();});
  document.querySelectorAll('.seatname').forEach(td=>td.onclick=()=>{
    const i=td.parentNode.dataset.i, d=document.querySelector(`.detrow[data-d="${i}"]`);
    if(d) d.hidden=!d.hidden;});
}
(async()=>{
  let d=null;
  try{const r=await fetch('data/seats.json',{cache:'no-store'}); if(r.ok) d=await r.json();}catch(e){}
  if(!d||!d.seats?.length){document.getElementById('out').innerHTML='<section><p class="empty">席位数据还在生成中，稍后再看</p></section>';return;}
  S=d.seats;
  const agg = t => {
    const rows = S.filter(s => (t === '全部' || s.type === t) && s.n_perf);
    const n = rows.reduce((a, s) => a + s.n_perf, 0);
    if (!n) return null;
    return {n, d5: (rows.reduce((a, s) => a + s.d5 * s.n_perf, 0) / n).toFixed(2),
            win: Math.round(rows.reduce((a, s) => a + s.win5 * s.n_perf, 0) / n)};
  };
  const cells = [['全部','全部席位'],['营业部','营业部'],['机构专用','机构专用'],['北向','北向']]
    .map(([t,label]) => { const a = agg(t); return a ?
      `<div class="sc"><b>${a.d5}%</b><span>${label}买后5日均涨（${a.win}%为正）</span></div>` : ''; }).join('');
  document.getElementById('sum').innerHTML = cells;
  document.getElementById('sumnote').textContent =
    '这是按买入笔数加权的平均值。四栏都是负的，说明跟着龙虎榜买入、持有5个交易日，平均跑输——差别只在亏多亏少。散户聚集的席位亏得最多。';
  document.getElementById('sub').insertAdjacentHTML('beforeend',` 统计区间：最近 ${d.days} 天，更新于 ${esc(d.updated)}。`);
  paint();
})();
</script>
<script>
(() => {
  const m = document.getElementById('mq'); if (!m) return;
  const box = document.createElement('div'); box.className = 'msug'; m.parentNode.appendChild(box);
  let NM = {};
  fetch('data/names.json', {cache:'force-cache'}).then(r => r.ok ? r.json() : {}).then(d => NM = d).catch(() => {});
  const esc2 = s => String(s ?? '').replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
  const go = c => { location.href = 'stock.html#' + c; box.innerHTML=''; };
  const sug = () => {
    const v = m.value.trim(); box.innerHTML = '';
    if (!v || /^[0-9]{6}$/.test(v)) return;
    const hit = Object.entries(NM).filter(([c, n]) => n.includes(v) || c.startsWith(v)).slice(0, 8);
    box.innerHTML = hit.map(([c, n]) => `<button data-c="${c}">${esc2(n)} <i>${c}</i></button>`).join('');
    box.querySelectorAll('button').forEach(b => b.onclick = () => go(b.dataset.c));
  };
  m.oninput = sug;
  m.onkeydown = e => { if (e.key !== 'Enter') return;
    const v = m.value.trim();
    if (/^[0-9]{6}$/.test(v)) return go(v);
    const first = box.querySelector('button'); if (first) go(first.dataset.c); };
  document.addEventListener('click', e => { if (!m.parentNode.contains(e.target)) box.innerHTML = ''; });
})();
</script>



<script>
// 右上角状态条：数据是哪天的、下次什么时候更新
(() => {
  const el = document.createElement('div');
  el.className = 'stat';
  el.innerHTML = '<span class="dot"></span><span>数据 <b id="stD">—</b></span><span class="nx" id="stN"></span>';
  const bar = document.querySelector('.topbar');
  if (bar) bar.appendChild(el); else document.body.insertBefore(el, document.body.firstChild);
  const bj = () => new Date(Date.now() + new Date().getTimezoneOffset()*60000 + 8*3600000);
  const next = () => { const n = bj(), t = new Date(n); t.setHours(23,10,0,0);
    if (n > t) t.setDate(t.getDate()+1);
    while (t.getDay()===0 || t.getDay()===6) t.setDate(t.getDate()+1);
    return {t, ms: t - n}; };
  const tick = () => { const {t, ms} = next(); const h = Math.floor(ms/3600000), m = Math.floor(ms%3600000/60000);
    document.getElementById('stN').textContent =
      `· 下次 ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}（${h>0?h+' 小时':''}${m} 分后）`; };
  tick(); setInterval(tick, 60000);
  fetch('data/status.json', {cache:'no-store'}).then(r => r.ok ? r.json() : null).then(d => {
    if (!d) return;
    const el2 = document.getElementById('stD'); el2.textContent = d.updated;
    const today = bj().toISOString().slice(0,10);
    if (d.updated !== today) document.querySelector('.stat .dot').style.background = 'var(--amber)';
  }).catch(() => {});
})();
</script>
</body>
</html>
