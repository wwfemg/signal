<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>机构持仓池</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&family=Noto+Sans+SC:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="assets/style.css">
<style>
  .filters{display:flex; flex-wrap:wrap; gap:6px; margin:4px 0 14px;}
  .filters button{font-size:12.5px; padding:6px 12px; border:1px solid var(--line); border-radius:2px;
    background:var(--panel); color:var(--ink-2); cursor:pointer;}
  .filters button.on{background:var(--accent); border-color:var(--accent); color:#fff;}
  table.t{width:100%; border-collapse:collapse; font-size:13px;}
  table.t th,table.t td{padding:7px 9px; border-bottom:1px solid var(--line-soft); text-align:left; white-space:nowrap;}
  table.t th{font-size:11.5px; color:var(--ink-3); font-weight:500; cursor:pointer;}
  td.num,th.num{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; text-align:right;}
  .down{color:var(--red);} .up{color:var(--green);}
  .tblwrap{overflow-x:auto;}
  .empty{font-size:13px;color:var(--ink-3);}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <p class="kicker">Signal　<a class="nav" href="index.html">← 首页</a>　<a class="nav" href="stock.html">查一只票 →</a></p>
    <h1>机构持仓池</h1>
    <p class="sub">外资通道账户出现在十大流通股东的票。成本是估算的——用它持股那个季度的成交量加权均价，不是真实成交价。名单按季度更新，中间靠回购公告附带的名单补。</p>
    <p class="warn"><b>这不是买入信号。</b>统计 1453 只票 × 14 个季度：这些名字多为国内资金借通道持股，一起进的组合下季度 51% 一起消失，股价跌破其成本后留榜率只有 22%——走不走跟赚不赚钱无关。能用的是三件事：谁和谁一起进来、下季度谁走了、成本线当反弹压力位。</p>
    <div class="filters" id="fh"></div>
    <div class="filters" id="fd"></div>
  </header>
  <div id="out"></div>
  <footer>数据来自东方财富十大流通股东。<b>研究记录，不构成投资建议。</b></footer>
</div>
<script>
const esc=s=>String(s??'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
const BANDS={'全部':()=>true,'跌破20%以上':r=>r.dev<=-20,'跌破10—20%':r=>r.dev>-20&&r.dev<=-10,
  '基本不变 ±10%':r=>r.dev>-10&&r.dev<10,'上涨10—30%':r=>r.dev>=10&&r.dev<30,'上涨30%以上':r=>r.dev>=30};
let P=[], holders=[], fh='全部', fd='全部', sort='dev';

function chips(id, list, cur, pick){
  const box=document.getElementById(id);
  box.innerHTML=list.map(x=>`<button data-x="${esc(x)}" class="${x===cur?'on':''}">${esc(x)}</button>`).join('');
  box.querySelectorAll('button').forEach(b=>b.onclick=()=>pick(b.dataset.x));
}
function paint(){
  chips('fh', holders, fh, v=>{fh=v; paint();});
  chips('fd', Object.keys(BANDS), fd, v=>{fd=v; paint();});
  let rows=P.filter(r=>(fh==='全部'||r.holder===fh)&&BANDS[fd](r));
  rows.sort((a,b)=> sort==='dev' ? a.dev-b.dev : sort==='ratio' ? b.ratio-a.ratio : b.q.localeCompare(a.q));
  document.getElementById('out').innerHTML = rows.length ? `<section>
    <p class="note">共 ${rows.length} 条，按${sort==='dev'?'偏离从低到高':sort==='ratio'?'占流通从高到低':'报告期'}排。点表头可换排序。</p>
    <div class="tblwrap"><table class="t"><thead><tr><th>代码</th><th>名称</th><th>机构</th>
      <th data-s="q">报告期</th><th class="num" data-s="ratio">占流通</th><th>变动</th>
      <th class="num">估算成本</th><th class="num">现价</th><th class="num" data-s="dev">偏离</th></tr></thead><tbody>`+
    rows.slice(0,400).map(r=>`<tr><td><a href="stock.html#${r.code}">${r.code}</a></td><td>${esc(r.name)}</td>
      <td>${esc(r.holder)}</td><td>${esc(r.q)}</td><td class="num">${r.ratio}%</td><td>${esc(r.chg)}</td>
      <td class="num">${r.cost}</td><td class="num">${r.price}</td>
      <td class="num ${r.dev<0?'down':'up'}">${r.dev>0?'+':''}${r.dev}%</td></tr>`).join('')+
    `</tbody></table></div>${rows.length>400?'<p class="note">只显示前 400 条，缩小筛选范围可看全</p>':''}</section>`
    : '<section><p class="empty">没有符合条件的记录</p></section>';
  document.querySelectorAll('th[data-s]').forEach(th=>th.onclick=()=>{sort=th.dataset.s; paint();});
}
(async()=>{
  let d=null;
  try{ const r=await fetch('data/pool.json',{cache:'no-store'}); if(r.ok) d=await r.json(); }catch(e){}
  if(!d){ document.getElementById('out').innerHTML='<section><p class="empty">持仓池数据还在生成中，稍后再看</p></section>'; return; }
  P=d.rows; holders=['全部',...Array.from(new Set(P.map(r=>r.holder))).sort()];
  document.querySelector('.sub').insertAdjacentHTML('beforeend',
    ` 数据更新于 ${esc(d.updated)}，行情为 ${esc(d.price_date)} 收盘。`);
  paint();
})();
</script>
</body>
</html>
