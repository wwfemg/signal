<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>按标签找票</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&family=Noto+Sans+SC:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="assets/style.css">
<style>
  .tabs{display:flex; flex-wrap:wrap; gap:6px; margin:4px 0 16px;}
  .tabs button{font-size:13px; padding:7px 13px; border:1px solid var(--line); border-radius:2px;
    background:var(--panel); color:var(--ink-2); cursor:pointer;}
  .tabs button.on{background:var(--accent); border-color:var(--accent); color:#fff;}
  table.t{width:100%; border-collapse:collapse; font-size:13px;}
  table.t th,table.t td{padding:8px 9px; border-bottom:1px solid var(--line-soft); text-align:left; vertical-align:top;}
  table.t td:nth-child(1),table.t td:nth-child(2){white-space:nowrap;}
  table.t td:nth-child(2){min-width:5.5em;}
  table.t th{font-size:11.5px; color:var(--ink-3); font-weight:500;}
  .tblwrap{overflow-x:auto;}
  .code{font-family:"IBM Plex Mono",monospace;}
  .empty{font-size:13px;color:var(--ink-3);}

  .topbar{display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    padding:10px clamp(14px,3vw,26px); border-bottom:1px solid var(--line); background:var(--panel);
    position:sticky; top:env(safe-area-inset-top, 0px); z-index:9;}
  .topbar .brand{font-family:"IBM Plex Serif",Georgia,serif; font-size:19px; font-weight:600;
    color:var(--ink); text-decoration:none; letter-spacing:-.01em;}
  .topbar .mini{flex:1; min-width:150px;}
  .topbar .mini input{width:100%; border:1px solid var(--line); background:var(--ground); color:var(--ink);
    border-radius:999px; padding:8px 16px; font-size:14px; outline:none; font-family:"Noto Sans SC",sans-serif;}
  .topbar .mini input:focus{border-color:var(--accent);}
  .topbar .tnav a{font-size:13px; color:var(--ink-2); text-decoration:none; margin-left:14px; white-space:nowrap;}
  .topbar .tnav a:hover{color:var(--accent);}
  .topbar .tnav{display:flex; gap:14px; flex:none;}
  .topbar .tnav a{margin-left:0;}
  @media (max-width:640px){
    .topbar{flex-wrap:wrap; row-gap:8px;}
    .topbar .brand{order:1;}
    .topbar .tnav{order:2; margin-left:auto; gap:12px;}
    .topbar .mini{order:3; flex-basis:100%;}
    .topbar .tnav a{font-size:12.5px;}
  }
  tbody tr.clk{cursor:pointer;}
  tbody tr.clk:hover{background:var(--line-soft);}

  .topbar .mini{position:relative;}
  .msug{position:absolute; left:0; right:0; top:calc(100% + 6px); z-index:20;
    display:flex; flex-direction:column; background:var(--panel);
    border-radius:8px; overflow:hidden; box-shadow:0 6px 20px rgba(0,0,0,.18);}
  .msug:empty{display:none;}
  .msug button{text-align:left; padding:10px 16px; border:none; border-bottom:1px solid var(--line-soft);
    background:transparent; color:var(--ink); font-size:14px; cursor:pointer;
    font-family:"Noto Sans SC",sans-serif;}
  .msug button:hover{background:var(--line-soft);}
  .msug button i{font-style:normal; color:var(--ink-3); font-size:12px;
    font-family:"IBM Plex Mono",monospace; margin-left:6px;}
  @media (max-width:640px){
  }

  .loading{display:flex; align-items:center; gap:10px; padding:18px 2px; color:var(--ink-3); font-size:13px;}
  .loading .sp{width:14px; height:14px; border:2px solid var(--line); border-top-color:var(--accent);
    border-radius:50%; animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion: reduce){ .loading .sp{animation:none;} }
  .topbar .mini input{min-width:80px;}

  @media (max-width:1100px){
    .topbar{flex-wrap:wrap; row-gap:8px;}
    .topbar .brand{order:1;}
    .topbar .tnav{order:2; margin-left:auto;}
    .topbar .stat,
    .topbar .mini{order:4; flex-basis:100%;}
  }
  @media (min-width:1101px){ .topbar{flex-wrap:nowrap;} }
</style>
</head>
<body>
<div class="topbar">
  <a class="brand" href="index.html">Signal</a>
  <div class="mini"><input id="mq" placeholder="输入代码跳转，如 600520" aria-label="跳转到某只票"></div>
  <nav class="tnav"><a href="ledger.html">台账</a><a href="pool.html">机构池</a><a href="tag.html">标签</a><a href="seats.html">席位</a><a href="https://github.com/wwfemg/signal/issues/new?template=feedback.yml" target="_blank">提建议</a></nav>
</div>
<div class="wrap">
  <header class="top">
    <h1>按标签找票</h1>
    <p class="sub" id="rule">点一个标签，列出所有符合条件的票。判定规则写死在脚本里，谁跑都一样。</p>
    <div class="tabs" id="tabs"></div>
  </header>
  <p class="note" id="tagupd"></p>
  <div id="out"><div class="loading"><span class="sp"></span>正在读取数据…</div></div>
  <section class="rules" id="allrules"></section>
  <footer>数据来自交易所公告、十大流通股东名册、龙虎榜。<b>研究记录，不构成投资建议。</b></footer>
</div>
<script>
const esc = s => String(s ?? '').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
let T = null;
function show(tag){
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on', b.dataset.t===tag));
  document.getElementById('rule').textContent = T.rules[tag] ? '判定规则：' + T.rules[tag] : '';
  const rows = Object.entries(T.stocks).filter(([c,v])=>v.tags.includes(tag));
  document.getElementById('out').innerHTML = rows.length ? `<section><p class="note">共 ${rows.length} 只</p>
    <div class="tblwrap"><table class="t"><thead><tr><th>代码</th><th>名称</th><th>为什么</th><th>其他标签</th></tr></thead><tbody>`+
    rows.map(([c,v])=>`<tr class="clk" data-c="${c}"><td class="code"><a href="stock.html#${c}">${c}</a></td><td>${esc(v.name)}</td>
      <td>${esc(v.why[tag]||'')}</td><td>${esc(v.tags.filter(x=>x!==tag).join('、'))}</td></tr>`).join('')+
    `</tbody></table></div></section>` : '<section><p class="empty">这个标签下暂时没有票</p></section>';
  document.querySelectorAll('tbody tr.clk').forEach(tr=>tr.onclick=e=>{
    if(e.target.tagName!=='A') location.href='stock.html#'+tr.dataset.c; });
  location.hash = encodeURIComponent(tag);
}
(async()=>{
  try{ T = await (await fetch('data/tags.json',{cache:'no-store'})).json(); }catch(e){
    document.getElementById('out').innerHTML='<section><p class="empty">标签数据暂不可用</p></section>'; return; }
  document.getElementById('tagupd').textContent = '数据更新 ' + (T.updated || '');
  const counts={};
  Object.values(T.stocks).forEach(v=>v.tags.forEach(t=>counts[t]=(counts[t]||0)+1));
  document.getElementById('tabs').innerHTML = Object.keys(T.rules)
    .filter(t=>counts[t]).map(t=>`<button data-t="${esc(t)}">${esc(t)} ${counts[t]}</button>`).join('');
  document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>show(b.dataset.t));
  document.getElementById('allrules').innerHTML = '<h2>八条逻辑怎么判定</h2><ol>' +
    Object.entries(T.rules).map(([k,v])=>`<li><b>${esc(k)}</b>：${esc(v)}</li>`).join('') +
    '</ol><p class="note">规则写死在脚本里，谁跑都一样。想加新逻辑，去 GitHub 提，写清怎么判定、用哪条公开数据验证。</p>';
  const h = decodeURIComponent(location.hash.replace('#',''));
  show(T.rules[h] ? h : Object.keys(T.rules).find(t=>counts[t]));
})();
</script>

<script>
(() => {
  const m = document.getElementById('mq'); if (!m) return;
  const box = document.createElement('div'); box.className = 'msug'; m.parentNode.appendChild(box);
  let NM = {};
  fetch('data/names.json', {cache:'force-cache'}).then(r => r.ok ? r.json() : {}).then(d => NM = d).catch(() => {});
  const esc2 = s => String(s ?? '').replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
  const go = c => { if (location.pathname.endsWith('stock.html')) { location.hash = c; }
                    else location.href = 'stock.html#' + c; box.innerHTML=''; };
  const sug = () => {
    const v = m.value.trim(); box.innerHTML = '';
    if (!v || /^[0-9]{6}$/.test(v)) return;
    const hit = Object.entries(NM).filter(([c, n]) => n.includes(v) || c.startsWith(v)).slice(0, 8);
    box.innerHTML = hit.map(([c, n]) => `<button data-c="${c}">${esc2(n)} <i>${c}</i></button>`).join('');
    box.querySelectorAll('button').forEach(b => b.onclick = () => go(b.dataset.c));
  };
  m.oninput = sug;
  m.onkeydown = e => {
    if (e.key !== 'Enter') return;
    const v = m.value.trim();
    if (/^[0-9]{6}$/.test(v)) return go(v);
    const first = box.querySelector('button');
    if (first) go(first.dataset.c);
  };
  document.addEventListener('click', e => { if (!m.parentNode.contains(e.target)) box.innerHTML = ''; });
})();
</script>



</body>
</html>
