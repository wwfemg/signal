<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>名单</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&family=Noto+Sans+SC:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="assets/style.css?v=20260925b">
<style>
  .modes{display:flex; flex-wrap:wrap;}
  .modes button{cursor:pointer; font-family:"Noto Sans SC",sans-serif;}
  .filters{display:flex; flex-wrap:wrap; gap:6px; margin:4px 0 12px; align-items:center;}
  .filters button{font-size:12.5px; padding:6px 12px; border:1px solid var(--line); border-radius:2px;
    background:var(--panel); color:var(--ink-2); cursor:pointer;}
  .filters button.on{background:var(--accent); border-color:var(--accent); color:#fff;}
  .flab{font-size:12px; color:var(--ink-3); margin-right:4px; min-width:4.6em;}
  table.t{width:100%; border-collapse:collapse; font-size:13px;}
  table.t th,table.t td{padding:8px 9px; border-bottom:1px solid var(--line-soft); text-align:left; vertical-align:top;}
  table.t th{font-size:11.5px; color:var(--ink-3); font-weight:500; cursor:pointer; white-space:nowrap;}
  table.t td:nth-child(1),table.t td:nth-child(2){white-space:nowrap;}
  table.t td:nth-child(2){min-width:5.5em;}
  td.num,th.num{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; text-align:right;}
  .tblwrap{overflow-x:auto;}
  .empty{font-size:13px;color:var(--ink-3);}
  tbody tr.clk{cursor:pointer;}
  tbody tr.clk:hover{background:var(--line-soft);}
  .seatname{cursor:pointer;} .seatname:hover{color:var(--accent);}
  .det{background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:12px 14px; margin:6px 0;}
  .loading{display:flex; align-items:center; gap:10px; padding:18px 2px; color:var(--ink-3); font-size:13px;}
  .loading .sp{width:14px; height:14px; border:2px solid var(--line); border-top-color:var(--accent);
    border-radius:50%; animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion: reduce){ .loading .sp{animation:none;} }
</style>
</head>
<body>
<div class="topbar">
  <a class="brand" href="index.html">Signal</a>
  <div class="mini"><input id="mq" placeholder="输入代码或名字" aria-label="跳转到某只票"></div>
  <nav class="tnav"><a href="list.html#tag">名单</a><a href="ledger.html">台账</a><a href="https://github.com/wwfemg/signal/issues/new?template=feedback.yml" target="_blank">提建议</a></nav>
</div>
<div class="wrap">
  <header class="top">
    <h1 id="ttl">名单</h1>
    <p class="sub" id="sub">挑票用的三种看法：按逻辑标签找、看外资通道账户在哪些票里、看龙虎榜席位一贯怎么操作。点任意一行进这只票的详情。</p>
    <div class="modes">
      <button data-m="tag">按标签</button>
      <button data-m="pool">机构持仓池</button>
      <button data-m="seats">龙虎榜席位</button>
    </div>
    <div id="warn"></div>
    <div class="filters" id="f1"></div>
    <div class="filters" id="f2"></div>
    <div class="filters" id="f3"></div>
  </header>
  <div id="out"><div class="loading"><span class="sp"></span>正在读取数据…</div></div>
  <section class="rules" id="rules"></section>
  <footer>
    数据来自交易所公告原文、十大流通股东名册、基金定期报告、龙虎榜。机构成本为估算（其持股季度的量价均价），不是真实成交价。<br>
    <b>研究记录，不构成投资建议。</b>　<a href="https://github.com/wwfemg/signal/blob/main/docs/CONTRIBUTING.md">投稿规矩</a>　<a href="https://github.com/wwfemg/signal">GitHub</a>
  </footer>
</div>
<script>
const esc = s => String(s ?? '').replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
const j = async n => { try { const r = await fetch('data/' + n, {cache:'no-store'}); return r.ok ? await r.json() : null; } catch(e) { return null; } };
const D = {}, S = {mode:'tag', tag:'', limit:100, pool:{q:'', holder:'全部', band:'全部', sort:'q'}, seats:{type:'营业部', min:'上榜≥10次', sort:'n'}};
const BANDS = {'全部':()=>true,'低于估算成本20%以上':r=>r.dev<=-20,'低于10—20%':r=>r.dev>-20&&r.dev<=-10,
  '相差10%以内':r=>r.dev>-10&&r.dev<10,'高出10—30%':r=>r.dev>=10&&r.dev<30,'高出30%以上':r=>r.dev>=30};
const MIN = {'全部':0,'上榜≥10次':10,'上榜≥30次':30,'上榜≥60次':60};
const CAVEAT = '机构成本是估算的：按它持股那个季度的量价均价算。季报滞后一到两个月，它可能早已离场。只能当参考，不是买入理由。';

function chips(id, list, cur, label, pick) {
  const box = document.getElementById(id);
  box.innerHTML = (label ? `<span class="flab">${label}</span>` : '') +
    list.map(x => `<button data-x="${esc(x)}" class="${x === cur ? 'on' : ''}">${esc(x)}</button>`).join('');
  box.querySelectorAll('button').forEach(b => b.onclick = () => pick(b.dataset.x));
}
const clearFilters = () => ['f1','f2','f3'].forEach(i => document.getElementById(i).innerHTML = '');
const rowClicks = () => document.querySelectorAll('tbody tr.clk').forEach(tr =>
  tr.onclick = e => { if (e.target.tagName !== 'A') location.href = 'stock.html#' + tr.dataset.c; });

function drawTag() {
  const T = D.tags;
  if (!T) return document.getElementById('out').innerHTML = '<p class="empty">标签数据暂不可用</p>';
  const counts = {};
  Object.values(T.stocks).forEach(v => v.tags.forEach(t => counts[t] = (counts[t] || 0) + 1));
  const tags = Object.keys(T.rules).filter(t => counts[t]);
  if (!S.tag || !counts[S.tag]) S.tag = tags[0];
  chips('f1', tags.map(t => `${t} ${counts[t]}`), `${S.tag} ${counts[S.tag]}`, '标签',
    v => { S.tag = v.replace(/\s\d+$/, ''); S.limit = 100; location.hash = 'tag=' + encodeURIComponent(S.tag); draw(); });
  document.getElementById('sub').textContent = '判定规则：' + (T.rules[S.tag] || '');
  const all = Object.entries(T.stocks).filter(([c, v]) => v.tags.includes(S.tag));
  const rows = all.slice(0, S.limit);
  document.getElementById('out').innerHTML = `<section><p class="note">共 ${all.length} 只，显示前 ${rows.length}　数据更新 ${esc(T.updated)}</p>
    <div class="tblwrap"><table class="t"><thead><tr><th>代码</th><th>名称</th><th>为什么</th><th>其他标签</th></tr></thead><tbody>` +
    rows.map(([c, v]) => `<tr class="clk" data-c="${c}"><td><a href="stock.html#${c}">${c}</a></td>
      <td>${esc(v.name)}</td><td>${esc(v.why[S.tag] || '')}</td>
      <td>${esc(v.tags.filter(x => x !== S.tag).join('、'))}</td></tr>`).join('') +
    `</tbody></table></div>${all.length > rows.length ?
      `<p class="note"><button class="more" id="more">显示更多（还有 ${all.length - rows.length} 只）</button></p>` : ''}</section>`;
  rowClicks();
  const mb = document.getElementById('more');
  if (mb) mb.onclick = () => { S.limit += 200; draw(); };
}

function drawPool() {
  const P = D.pool?.rows;
  if (!P) return document.getElementById('out').innerHTML = '<p class="empty">机构池数据暂不可用</p>';
  const dates = Array.from(new Set(P.map(r => r.q))).sort().reverse();
  const holders = ['全部', ...Array.from(new Set(P.map(r => r.holder))).sort()];
  if (!S.pool.q) {           // 默认选最新的季报，而不是只有一两只票的快照
    const rep = dates.find(d => P.some(r => r.q === d && (r.kind || '季报') === '季报'));
    S.pool.q = rep || dates[0];
  }
  chips('f1', ['全部', ...dates.map(d => d + (P.some(r => r.q === d && r.kind === '快照') ? ' 快照' : ''))], S.pool.q + (P.some(r => r.q === S.pool.q && r.kind === '快照') ? ' 快照' : ''), '日期', v => { S.pool.q = v.replace(' 快照',''); draw(); });
  chips('f2', holders, S.pool.holder, '机构', v => { S.pool.holder = v; draw(); });
  chips('f3', Object.keys(BANDS), S.pool.band, '现价 vs 成本', v => { S.pool.band = v; draw(); });
  document.getElementById('sub').textContent = CAVEAT;
  let rows = P.filter(r => (S.pool.q === '全部' || r.q === S.pool.q) &&
    (S.pool.holder === '全部' || r.holder === S.pool.holder) && BANDS[S.pool.band](r));
  const k = S.pool.sort;
  rows.sort((a, b) => k === 'dev' ? a.dev - b.dev : k === 'ratio' ? b.ratio - a.ratio : b.q.localeCompare(a.q));
  document.getElementById('out').innerHTML = rows.length ? `<section>
    <p class="note">共 ${rows.length} 条　行情 ${esc(D.pool.price_date || '')}　点表头换排序</p>
    <div class="tblwrap"><table class="t"><thead><tr><th>代码</th><th>名称</th><th>机构</th>
      <th data-s="q">日期</th><th>来源</th><th class="num" data-s="ratio">占流通</th><th>变动</th>
      <th class="num">估算成本</th><th class="num">现价</th><th class="num" data-s="dev">现价 vs 估算成本</th></tr></thead><tbody>` +
    rows.slice(0, 400).map(r => `<tr class="clk" data-c="${r.code}"><td><a href="stock.html#${r.code}">${r.code}</a></td>
      <td>${esc(r.name)}</td><td>${esc(r.holder)}</td><td>${esc(r.q)}</td><td>${esc(r.kind || '季报')}</td>
      <td class="num">${r.ratio}%</td><td>${esc(r.chg)}</td><td class="num">${r.cost}</td><td class="num">${r.price}</td>
      <td class="num ${r.dev < 0 ? 'down' : 'up'}">${r.dev > 0 ? '+' : ''}${r.dev}%${r.susp ? ' <span style="color:var(--amber)" title="偏离过大，多半是除权或长期停牌">⚠</span>' : ''}</td></tr>`).join('') +
    `</tbody></table></div>${rows.length > 400 ? '<p class="note">只显示前 400 条</p>' : ''}</section>`
    : '<p class="empty">没有符合条件的记录</p>';
  document.querySelectorAll('th[data-s]').forEach(th => th.onclick = () => { S.pool.sort = th.dataset.s; draw(); });
  rowClicks();
}

function drawSeats() {
  const A = D.seats?.seats;
  if (!A) return document.getElementById('out').innerHTML = '<p class="empty">席位数据暂不可用</p>';
  chips('f1', ['营业部', '机构专用', '北向', '全部'], S.seats.type, '类型', v => { S.seats.type = v; draw(); });
  chips('f2', Object.keys(MIN), S.seats.min, '次数', v => { S.seats.min = v; draw(); });
  document.getElementById('sub').textContent =
    `看的是统计倾向，不是预测：龙虎榜只告诉你昨天谁买了。一个席位背后可能好几拨人，也可能换了人。统计区间最近 ${D.seats.days} 天。`;
  let rows = A.filter(s => (S.seats.type === '全部' || s.type === S.seats.type) && s.n >= MIN[S.seats.min]);
  const k = S.seats.sort;
  rows.sort((a, b) => k === 'n' ? b.n - a.n : k === 'win5' ? ((b.win5 ?? -1) - (a.win5 ?? -1)) : ((b[k] ?? -99) - (a[k] ?? -99)));
  const agg = t => { const r = A.filter(s => (t === '全部' || s.type === t) && s.n_perf);
    const n = r.reduce((a, s) => a + s.n_perf, 0);
    return n ? {d5: (r.reduce((a, s) => a + s.d5 * s.n_perf, 0) / n).toFixed(2),
                win: Math.round(r.reduce((a, s) => a + s.win5 * s.n_perf, 0) / n)} : null; };
  const tiles = [['全部','全部席位'],['营业部','营业部'],['机构专用','机构专用'],['北向','北向']]
    .map(([t, label]) => { const a = agg(t); return a ? `<div class="sc"><b>${a.d5}%</b><span>${label}买后5日均涨（${a.win}%为正）</span></div>` : ''; }).join('');
  document.getElementById('out').innerHTML = `<section>
    <div class="score">${tiles}</div>
    <p class="note">按买入笔数加权。四栏都是负的：跟着龙虎榜买、持有5个交易日，平均跑输，差别只在亏多亏少。散户聚集的席位亏得最多。</p>
    <p class="note">共 ${rows.length} 个席位，点名字看它最近买过什么。点表头换排序。</p>
    <div class="tblwrap"><table class="t"><thead><tr><th>席位</th><th class="num" data-s="n">上榜次数</th>
      <th class="num" data-s="buy_yi">买入(亿)</th><th class="num" data-s="net_yi">净买入(亿)</th>
      <th class="num" data-s="d1">次日均涨</th><th class="num" data-s="d5">5日均涨</th>
      <th class="num" data-s="d10">10日均涨</th><th class="num" data-s="win5">5日胜率</th></tr></thead><tbody>` +
    rows.slice(0, 200).map((s, i) => `<tr data-i="${i}"><td class="seatname">${esc(s.name)}</td>
      <td class="num">${s.n}</td><td class="num">${s.buy_yi}</td>
      <td class="num ${s.net_yi < 0 ? 'down' : 'up'}">${s.net_yi}</td>
      <td class="num ${(s.d1 ?? 0) < 0 ? 'down' : 'up'}">${s.d1 ?? '—'}%</td>
      <td class="num ${(s.d5 ?? 0) < 0 ? 'down' : 'up'}">${s.d5 ?? '—'}%</td>
      <td class="num ${(s.d10 ?? 0) < 0 ? 'down' : 'up'}">${s.d10 ?? '—'}%</td>
      <td class="num">${s.win5 ?? '—'}%<span style="color:var(--ink-3);font-size:11px">/${s.n_perf}</span></td></tr>
      <tr class="detrow" data-d="${i}" hidden><td colspan="8"><div class="det">${
        (s.recent || []).map(r => `${esc(r.date)}　<a href="stock.html#${r.code}">${esc(r.name || r.code)}</a>　净 ${r.net} 万　买后5日 ${r.d5 ?? '—'}%`).join('<br>') || '—'
      }</div></td></tr>`).join('') + `</tbody></table></div></section>`;
  document.querySelectorAll('th[data-s]').forEach(th => th.onclick = () => { S.seats.sort = th.dataset.s; draw(); });
  document.querySelectorAll('.seatname').forEach(td => td.onclick = () => {
    const d = document.querySelector(`.detrow[data-d="${td.parentNode.dataset.i}"]`); if (d) d.hidden = !d.hidden; });
}

function draw() {
  document.querySelectorAll('.modes button').forEach(b => b.classList.toggle('on', b.dataset.m === S.mode));
  document.getElementById('ttl').textContent = {tag:'按标签找票', pool:'机构持仓池', seats:'龙虎榜席位'}[S.mode];
  document.getElementById('warn').innerHTML = S.mode === 'pool'
    ? `<p class="warn"><b>这不是买入信号。</b>统计 1453 只票 × 14 个季度：名册上的外资名字多为国内资金借通道持股，一起进的组合下季度 51% 一起消失，跌破其成本后留榜率只有 22%。能用的是三件事：谁和谁一起进来、下季度谁走了、成本线当反弹压力位。</p>` : '';
  clearFilters();
  ({tag: drawTag, pool: drawPool, seats: drawSeats})[S.mode]();
  document.getElementById('rules').innerHTML = S.mode === 'tag' && D.tags ?
    '<h2>全部标签怎么判定</h2><ol>' + Object.entries(D.tags.rules).map(([k, v]) => `<li><b>${esc(k)}</b>：${esc(v)}</li>`).join('') +
    '</ol><p class="note">规则写死在脚本里，谁跑都一样。想加新逻辑，去 GitHub 提，写清怎么判定、用哪条公开数据验证。</p>' : '';
}

function fromHash() {
  const h = decodeURIComponent(location.hash.replace('#', ''));
  if (h.startsWith('tag=')) { S.mode = 'tag'; S.tag = h.slice(4); }
  else if (['tag', 'pool', 'seats'].includes(h)) S.mode = h;
}

(async () => {
  fromHash();
  const [tags, pool, seats] = await Promise.all(['tags.json', 'pool.json', 'seats.json'].map(j));
  Object.assign(D, {tags, pool, seats});
  document.querySelectorAll('.modes button').forEach(b => b.onclick = () => {
    S.mode = b.dataset.m; location.hash = S.mode; draw(); });
  addEventListener('hashchange', () => { fromHash(); draw(); });
  draw();
})();
</script>
<script>
(() => {
  const m = document.getElementById('mq'); if (!m) return;
  const box = document.createElement('div'); box.className = 'msug'; m.parentNode.appendChild(box);
  let NM = {};
  fetch('data/names.json', {cache:'force-cache'}).then(r => r.ok ? r.json() : {}).then(d => NM = d).catch(() => {});
  const go = c => { location.href = 'stock.html#' + c; };
  m.oninput = () => {
    const v = m.value.trim(); box.innerHTML = '';
    if (!v || /^[0-9]{6}$/.test(v)) return;
    box.innerHTML = Object.entries(NM).filter(([c, n]) => n.includes(v) || c.startsWith(v)).slice(0, 8)
      .map(([c, n]) => `<button data-c="${c}">${esc(n)} <i>${c}</i></button>`).join('');
    box.querySelectorAll('button').forEach(b => b.onclick = () => go(b.dataset.c));
  };
  m.onkeydown = e => { if (e.key !== 'Enter') return;
    const v = m.value.trim();
    if (/^[0-9]{6}$/.test(v)) return go(v);
    const f = box.querySelector('button'); if (f) go(f.dataset.c); };
  document.addEventListener('click', e => { if (!m.parentNode.contains(e.target)) box.innerHTML = ''; });
})();
</script>
<script>
(() => {
  const el = document.createElement('div');
  el.className = 'stat';
  el.innerHTML = '<span class="dot"></span><span>数据 <b id="stD">—</b></span><span class="nx" id="stN"></span>';
  const bar = document.querySelector('.topbar');
  if (bar) bar.appendChild(el); else document.body.insertBefore(el, document.body.firstChild);
  const bj = () => new Date(Date.now() + new Date().getTimezoneOffset()*60000 + 8*3600000);
  const nx = () => { const n = bj(), t = new Date(n); t.setHours(23,10,0,0);
    if (n > t) t.setDate(t.getDate()+1);
    while (t.getDay()===0 || t.getDay()===6) t.setDate(t.getDate()+1);
    return {t, ms: t - n}; };
  const tick = () => { const o = nx(); const h = Math.floor(o.ms/3600000), m = Math.floor(o.ms%3600000/60000);
    document.getElementById('stN').textContent =
      `· 下次 ${String(o.t.getHours()).padStart(2,'0')}:${String(o.t.getMinutes()).padStart(2,'0')}（${h>0?h+' 小时':''}${m} 分后）`; };
  tick(); setInterval(tick, 60000);
  fetch('data/status.json', {cache:'no-store'}).then(r => r.ok ? r.json() : null).then(d => {
    if (!d) return;
    document.getElementById('stD').textContent = d.updated;
    if (d.updated !== bj().toISOString().slice(0,10))
      document.querySelector('.stat .dot').style.background = 'var(--amber)';
  }).catch(() => {});
})();
</script>
</body>
</html>
