<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>查一只票</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&family=Noto+Sans+SC:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="assets/style.css">
<style>
  .search{display:flex; gap:8px; margin:6px 0 18px;}
  .search input{flex:1; min-width:0; font-size:16px; padding:11px 13px; border-radius:3px;
    border:1px solid var(--line); background:var(--panel); color:var(--ink);
    font-family:"IBM Plex Mono", monospace;}
  .search input:focus{outline:2px solid var(--accent); outline-offset:-1px;}
  .search button{padding:11px 18px; font-size:14px; border:none; border-radius:3px; cursor:pointer;
    background:var(--accent); color:#fff;}
  .hits{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:16px;}
  .hits button{font-size:12.5px; padding:5px 10px; border:1px solid var(--line); border-radius:2px;
    background:var(--panel); color:var(--ink-2); cursor:pointer;}
  .tagrow{display:flex; flex-wrap:wrap; gap:6px; margin:2px 0 12px;}
  a.tag{font-size:12px; padding:4px 11px; border-radius:999px; background:var(--accent-soft);
    color:var(--accent); text-decoration:none;}
  a.tag:hover{background:var(--accent); color:#fff;}
  .whylist{margin:0 0 14px; padding:0; list-style:none; display:flex; flex-direction:column; gap:5px;}
  .whylist li{font-size:13px; color:var(--ink-2); border-left:2px solid var(--line); padding-left:10px;}
  .whylist b{color:var(--ink);}
  table.t{width:100%; border-collapse:collapse; font-size:13px;}
  table.t th, table.t td{padding:7px 9px; border-bottom:1px solid var(--line-soft); text-align:left;}
  table.t th{font-size:11.5px; color:var(--ink-3); font-weight:500;}
  table.t td.num{font-family:"IBM Plex Mono", monospace; font-variant-numeric:tabular-nums; text-align:right;}
  .down{color:var(--red);} .up{color:var(--green);}
  .tblwrap{overflow-x:auto;}
  .empty{font-size:13px; color:var(--ink-3);}
  .grp{font-size:13.5px; margin:16px 0 6px; font-family:"IBM Plex Mono", monospace; color:var(--ink);}
  .gk{font-family:"Noto Sans SC",sans-serif; font-size:12px; color:var(--ink-3); font-weight:400;}
  .gnew{font-family:"Noto Sans SC",sans-serif; font-size:11px; margin-left:8px; padding:2px 8px;
        border-radius:2px; background:var(--accent-soft); color:var(--accent);}

  .topbar{display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    padding:10px clamp(14px,3vw,26px); border-bottom:1px solid var(--line); background:var(--panel);
    position:sticky; top:env(safe-area-inset-top, 0px); z-index:9;}
  .topbar .brand{font-family:"IBM Plex Serif",Georgia,serif; font-size:19px; font-weight:600;
    color:var(--ink); text-decoration:none; letter-spacing:-.01em;}
  .topbar .mini{flex:1; min-width:150px;}
  .topbar .mini input{width:100%; border:1px solid var(--line); background:var(--ground); color:var(--ink);
    border-radius:999px; padding:8px 16px; font-size:14px; outline:none; font-family:"Noto Sans SC",sans-serif;}
  .topbar .mini input:focus{border-color:var(--accent);}
  .topbar .tnav a{font-size:13px; color:var(--ink-2); text-decoration:none; margin-left:14px; white-space:nowrap;}
  .topbar .tnav a:hover{color:var(--accent);}
  @media (max-width:520px){ .topbar .tnav a{margin-left:10px; font-size:12.5px;} }
  tbody tr.clk{cursor:pointer;}
  tbody tr.clk:hover{background:var(--line-soft);}
</style>
</head>
<body>
<div class="topbar">
  <a class="brand" href="index.html">Signal</a>
  <div class="mini"><input id="mq" placeholder="输入代码跳转，如 600520" aria-label="跳转到某只票"></div>
  <nav class="tnav"><a href="ledger.html">台账</a><a href="pool.html">机构池</a><a href="tag.html">标签</a></nav>
</div>
<div class="wrap">
  <header class="top">
    <h1>查一只票</h1>
    <p class="sub" id="lead">在上面的框里输入代码，看这只票属于哪几种逻辑、时间轴走到哪一步、哪些机构在里面、最近有没有上龙虎榜。</p>
    <div class="hits" id="hits"></div>
  </header>
  <div id="out"></div>
  <section class="rules" id="rules"></section>
  <footer>
    数据来自交易所公告、十大流通股东名册、龙虎榜。机构成本为估算（其持股季度的量价均价），不是真实成交价。<br>
    <b>研究记录，不构成投资建议。</b>
  </footer>
</div>

<script>
const D = {};
const j = async n => { try { const r = await fetch('data/' + n, {cache:'no-store'}); return r.ok ? await r.json() : null; } catch(e) { return null; } };
const CAVEAT = '机构成本是估算的：按它持股那个季度的量价均价算。季报滞后一到两个月，它可能早已离场。只能当参考，不是买入理由。';
const esc = s => String(s ?? '').replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

function render(code) {
  const t = D.tags?.stocks?.[code], tl = D.timeline?.stocks?.[code];
  const pool = (D.pool?.rows || []).filter(r => r.code === code);
  const lhb = D.lhb?.stocks?.[code] || [];
  const led = (D.ledger?.entries || []).find(e => e.code === code);
  const name = t?.name || tl?.name || pool[0]?.name || led?.name || '';
  if (!t && !tl && !pool.length && !lhb.length && !led) {
    const nm = D.names?.[code] || '';
    const title = nm ? `${esc(code)} ${esc(nm)}` : esc(code);
    const issue = 'https://github.com/wwfemg/signal/issues/new?template=nominate.yml&title=' +
      encodeURIComponent('[提名] ' + code + ' ' + nm);
    document.getElementById('out').innerHTML = `<section>
      <h2>${title}</h2>
      <p class="empty">这只票我们还没有记录。收录的是：台账跟过的、有外资通道账户持仓的、近30天上过龙虎榜的、或者有解禁压力的票。</p>
      <div class="entries" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:14px">
        <a class="entry" href="https://www.cninfo.com.cn/new/fulltextSearch?keyWord=${esc(code)}" target="_blank"><b>去巨潮查公告</b><p>交易所指定披露网站，公告原文都在这</p></a>
        <a class="entry" href="https://quote.eastmoney.com/concept/${code[0]==='6'?'sh':'sz'}${esc(code)}.html" target="_blank"><b>去东财看行情</b><p>股东、公告、资金流</p></a>
        <a class="entry" href="${issue}" target="_blank"><b>提名这只票</b><p>写清触发它的公告和在等什么，核实后录入台账</p></a>
      </div>
      <p class="note" style="margin-top:14px">本机执行：<code>python3 tools/timeline.py ${esc(code)}</code> 可以直接拉它的时间轴，<code>python3 tools/unlock.py ${esc(code)}</code> 看解禁表。</p>
    </section>`;
    return;
  }
  document.title = (name ? name + ' ' + code : code) + '｜Signal';
  const h1 = document.querySelector('h1'); if (h1) h1.textContent = name ? `${name} ${code}` : code;
  const lead = document.getElementById('lead'); if (lead) lead.remove();
  let h = `<section>`;
  h += `<p class="note">更新 ${esc(D.tags?.updated || D.ledger?.updated || '')}</p>`;
  if (t?.tags?.length) {
    h += `<div class="tagrow">${t.tags.map(x => `<a class="tag" href="tag.html#${encodeURIComponent(x)}">${esc(x)}</a>`).join('')}</div>`;
    h += `<ul class="whylist">${Object.entries(t.why || {}).map(([k,v]) => `<li><b>${esc(k)}</b>：${esc(v)}</li>`).join('')}</ul>`;
  } else { h += `<p class="empty">暂无自动标签</p>`; }
  h += `</section>`;

  if (led) {
    h += `<section><h2>台账</h2><div class="cards"><article class="card">
      <header class="card-top"><h3>状态：${esc(led.status)}</h3></header><dl>
      <dt>触发事实</dt><dd>${esc(led.trigger)}</dd>
      <dt>在等什么</dt><dd>${esc(led.waiting)}</dd>
      <dt>什么算看错</dt><dd>${esc(led.falsify)}</dd>
      <dt>结果回看</dt><dd>${esc(led.review)}</dd></dl></article></div></section>`;
  }

  if (pool.length) {
    const byDate = {};
    pool.forEach(r => (byDate[r.q] = byDate[r.q] || []).push(r));
    const dates = Object.keys(byDate).sort().reverse();
    h += `<section><h2>机构持仓（外资通道账户）</h2>
      <p class="note">${CAVEAT}最新的排在最前面。“快照”来自公司回购公告附带的股东名单，基准日离披露只有 2—3 天；“季报”是定期报告，滞后 1—2 个月。</p>`;
    dates.forEach((d, i) => {
      const rows = byDate[d], kind = rows[0].kind || '季报';
      h += `<h3 class="grp"><a href="pool.html#${esc(d)}">${esc(d)}</a>　<span class="gk">${esc(kind)}</span>${i === 0 ? '<span class="gnew">最新</span>' : ''}</h3>
        <div class="tblwrap"><table class="t"><thead><tr><th>机构</th><th>名次</th><th>占流通</th><th>变动</th>
        <th>估算成本</th><th>现价</th><th>现价 vs 估算成本</th></tr></thead><tbody>` +
        rows.map(r => `<tr><td>${esc(r.holder)}</td><td class="num">${r.rank}</td>
          <td class="num">${r.ratio}%</td><td>${esc(r.chg)}</td>
          <td class="num">${r.cost}</td><td class="num">${r.price}</td>
          <td class="num ${r.dev < 0 ? 'down' : 'up'}">${r.dev > 0 ? '+' : ''}${r.dev}%</td></tr>`).join('') +
        `</tbody></table></div>`;
    });
    h += `</section>`;
  }

  if (lhb.length) {
    h += `<section><h2>近30天龙虎榜</h2><div class="tblwrap"><table class="t">
      <thead><tr><th>日期</th><th>当日涨跌</th><th>上榜原因</th></tr></thead><tbody>` +
      lhb.map(r => `<tr><td>${esc(r.date)}</td>
        <td class="num ${r.chg < 0 ? 'down' : 'up'}">${r.chg > 0 ? '+' : ''}${r.chg}%</td>
        <td>${esc(r.explain)}</td></tr>`).join('') + `</tbody></table></div></section>`;
  }

  if (tl) {
    const li = (e, f) => `<li class="${f ? 'tl-f' : 'tl-p'}"><span class="tl-date">${esc(e.date || '待定')}</span><span class="tl-kind">${esc(e.kind)}</span><span class="tl-t">${esc(e.title)}</span></li>`;
    h += `<section><h2>时间轴</h2><ul class="tl-list">` +
      (tl.future || []).map(e => li(e, true)).join('') +
      `<li class="tl-now"><span class="tl-date">今天</span><span class="tl-kind">—</span><span class="tl-t">上面是今后已知的日子，下面是已经发生的</span></li>` +
      (tl.past || []).map(e => li(e, false)).join('') + `</ul></section>`;
  }
  document.getElementById('out').innerHTML = h;
  location.hash = code;
}

function search() {
  const box = document.getElementById('q') || document.getElementById('mq');
  const q = box.value.trim();
  if (!q) return;
  if (/^\d{6}$/.test(q)) { render(q); document.getElementById('hits').innerHTML = ''; return; }
  const all = Object.assign({}, D.names || {});
  for (const [c, v] of Object.entries(D.tags?.stocks || {})) all[c] = v.name || all[c] || '';
  for (const [c, v] of Object.entries(D.timeline?.stocks || {})) all[c] = all[c] || v.name || '';
  const hit = Object.entries(all).filter(([c, n]) => n && n.includes(q)).slice(0, 12);
  document.getElementById('hits').innerHTML = hit.length
    ? hit.map(([c, n]) => `<button data-c="${c}">${esc(c)} ${esc(n)}</button>`).join('')
    : '<span class="empty">没找到这个名字，试试代码</span>';
  document.querySelectorAll('.hits button').forEach(b =>
    b.onclick = () => render(b.dataset.c));
}

(async () => {
  const [tags, timeline, pool, lhb, ledger, names] = await Promise.all(
    ['tags.json','timeline.json','pool.json','lhb.json','ledger.json','names.json'].map(j));
  Object.assign(D, {tags, timeline, pool, lhb, ledger, names});
  const rules = tags?.rules || {};
  document.getElementById('rules').innerHTML = '<h2>标签怎么判定</h2><ol>' +
    Object.entries(rules).map(([k, v]) => `<li><b>${esc(k)}</b>：${esc(v)}</li>`).join('') +
    '</ol><p class="note">规则都写死在脚本里，谁跑都一样。想加新标签，在 GitHub 提一个 Issue，写清怎么判定、用哪条公开数据验证。</p>';

  const h = location.hash.replace('#', '');
  if (/^\d{6}$/.test(h)) { document.getElementById('q').value = h; render(h); }
})();
</script>

<script>
(() => { const m = document.getElementById('mq'); if (!m) return;
  m.onkeydown = e => { if (e.key !== 'Enter') return;
    const v = m.value.trim();
    if (/^[0-9]{6}$/.test(v)) location.href = 'stock.html#' + v;
    else if (v) { const box = document.getElementById('q'); if (box) { box.value = v; search(); }
      else location.href = 'index.html'; } }; })();
</script>
</body>
</html>
