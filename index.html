<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Signal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&family=Noto+Sans+SC:wght@300;400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>  *,*::before,*::after{box-sizing:border-box;}

  :root{
    color-scheme: light;
    --ground:#f6f5f2; --panel:#ffffff; --line:#e2ded6; --line-soft:#eeebe5;
    --ink:#1c1b18; --ink-2:#4a473f; --ink-3:#7c7768;
    --accent:#9a5b18; --accent-soft:#f3e7d8;
    --red:#a32b25; --red-soft:#f7e2e0;
    --amber:#8a6a12; --amber-soft:#f6ecd2;
    --green:#25604a; --green-soft:#e0eee7;
    --blue:#2a4e77; --blue-soft:#e2eaf3;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --ground:#17161a; --panel:#201f24; --line:#35333a; --line-soft:#2a2930;
      --ink:#efece6; --ink-2:#c0bcb3; --ink-3:#8b867c;
      --accent:#e2a662; --accent-soft:#3a2d1c;
      --red:#e98b84; --red-soft:#3b2220;
      --amber:#d9b45a; --amber-soft:#362f18;
      --green:#7dc3a4; --green-soft:#1d3029;
      --blue:#8db4de; --blue-soft:#1d2a3a;
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --ground:#17161a; --panel:#201f24; --line:#35333a; --line-soft:#2a2930;
    --ink:#efece6; --ink-2:#c0bcb3; --ink-3:#8b867c;
    --accent:#e2a662; --accent-soft:#3a2d1c;
    --red:#e98b84; --red-soft:#3b2220;
    --amber:#d9b45a; --amber-soft:#362f18;
    --green:#7dc3a4; --green-soft:#1d3029;
    --blue:#8db4de; --blue-soft:#1d2a3a;
  }
  body{
    margin:0; background:var(--ground); color:var(--ink);
    font-family:"Noto Sans SC", -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    font-size:15px; line-height:1.7;
  }
  .wrap{max-width:900px; margin:0 auto; padding-inline:16px; padding-block:28px 56px;}
  header.top{border-bottom:2px solid var(--ink); padding-bottom:14px; margin-bottom:26px;}
  .kicker{font-family:"IBM Plex Mono", ui-monospace, monospace; font-size:11px; letter-spacing:.16em;
          text-transform:uppercase; color:var(--accent); margin:0 0 6px;}
  h1{font-family:"IBM Plex Serif", Georgia, serif; font-weight:600; font-size:clamp(24px,3.4vw,32px); line-height:1.25; margin:0 0 8px; text-wrap:balance; letter-spacing:.01em;}
  .sub{color:var(--ink-3); font-size:13px; margin:0;}
  .stats{display:flex; flex-wrap:wrap; gap:8px 20px; margin-top:14px;
         font-family:"IBM Plex Mono", monospace; font-size:12.5px; color:var(--ink-2); font-variant-numeric:tabular-nums;}
  .stats b{color:var(--ink); font-weight:600;}
  section{margin-bottom:34px;}
  h2{font-family:"IBM Plex Serif", Georgia, serif; font-weight:600; font-size:17px; margin:0 0 4px; letter-spacing:.02em;}
  .note{color:var(--ink-3); font-size:12.5px; margin:0 0 14px;}
  .rows{display:flex; flex-direction:column; gap:1px; background:var(--line-soft);
        border:1px solid var(--line); border-radius:3px; overflow:hidden;}
  .row{display:grid; grid-template-columns:96px 1fr auto; gap:6px 14px; align-items:baseline;
       background:var(--panel); padding:12px 14px;}
  .when{font-family:"IBM Plex Mono", monospace; font-size:12px; color:var(--ink-3);
        font-variant-numeric:tabular-nums; white-space:nowrap;}
  .what{min-width:0;}
  .what strong{font-weight:700;}
  .what p{margin:3px 0 0; font-size:13px; color:var(--ink-2);}
  .pill{font-size:11.5px; font-weight:500; padding:2px 9px; border-radius:2px; white-space:nowrap;}
  .p-red{background:var(--red-soft); color:var(--red);}
  .p-amber{background:var(--amber-soft); color:var(--amber);}
  .p-green{background:var(--green-soft); color:var(--green);}
  .p-blue{background:var(--blue-soft); color:var(--blue);}
  .p-mute{background:var(--line-soft); color:var(--ink-3);}
  @media (max-width:560px){
    .row{grid-template-columns:1fr auto; }
    .when{grid-column:1 / -1; order:-1;}
  }
  .move{display:grid; grid-template-columns:1fr 78px 1fr; gap:6px 14px; align-items:baseline;
        background:var(--panel); padding:11px 14px;}
  .move .pct{font-family:"IBM Plex Mono", monospace; font-weight:600; font-size:13.5px;
              color:var(--red); text-align:right; font-variant-numeric:tabular-nums;}
  .move p{margin:0; font-size:12.5px; color:var(--ink-2);}
  @media (max-width:560px){ .move{grid-template-columns:1fr auto;} .move p{grid-column:1 / -1;} }
  .finding{background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--accent);
           border-radius:2px; padding:13px 15px; margin-bottom:10px;}
  .finding h3{font-size:14.5px; margin:0 0 5px;}
  .finding p{margin:0; font-size:13.5px; color:var(--ink-2);}
  .finding .tag{font-family:"IBM Plex Mono", monospace; font-size:11px; color:var(--ink-3); letter-spacing:.06em;}
  .rules{border-top:1px solid var(--line); padding-top:16px;}
  .rules ol{margin:0; padding-left:20px;}
  .rules li{margin-bottom:9px; font-size:13.5px; color:var(--ink-2);}
  .rules li b{color:var(--ink);}
  footer{margin-top:40px; border-top:1px solid var(--line); padding-top:14px;
         font-size:12px; color:var(--ink-3);}
  .legend{display:flex; flex-wrap:wrap; gap:10px; margin-top:10px; font-size:12px; color:var(--ink-3);}

  .cards{display:flex; flex-direction:column; gap:12px;}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:3px; padding:14px 16px;}
  .card-top{display:flex; align-items:center; justify-content:space-between; gap:10px;
            border-bottom:1px solid var(--line-soft); padding-bottom:9px; margin-bottom:10px;}
  .card-top h3{font-size:15.5px; margin:0;}
  .code{font-family:"IBM Plex Mono", monospace; font-size:12px; color:var(--ink-3); font-weight:400; margin-left:4px;}
  .card dl{display:grid; grid-template-columns:76px 1fr; gap:7px 14px; margin:0;}
  .card dt{font-size:12px; color:var(--ink-3); letter-spacing:.04em; white-space:nowrap;}
  .card dd{margin:0; font-size:13.5px; color:var(--ink-2);}
  @media (max-width:560px){
    .card dl{grid-template-columns:1fr; gap:2px 0;}
    .card dt{margin-top:7px;}
  }
  .warn{margin:12px 0 0; padding:11px 14px; font-size:12.5px; line-height:1.65;
        background:var(--red-soft); color:var(--red); border-radius:2px;}
  .warn b{font-weight:700;}

  .tl{margin-top:12px; border-top:1px solid var(--line-soft); padding-top:9px;}
  .tl summary{cursor:pointer; font-size:12.5px; color:var(--accent); list-style:none;}
  .tl summary::-webkit-details-marker{display:none;}
  .tl summary::before{content:"▸ "; }
  .tl[open] summary::before{content:"▾ "; }
  .tl-list{list-style:none; margin:10px 0 2px; padding:0; display:flex; flex-direction:column; gap:5px;}
  .tl-list li{display:grid; grid-template-columns:82px 62px 1fr; gap:10px; align-items:baseline;
              font-size:12.5px; color:var(--ink-2); padding-left:10px; border-left:2px solid var(--line);}
  .tl-date{font-family:"IBM Plex Mono", monospace; color:var(--ink-3); font-variant-numeric:tabular-nums;}
  .tl-kind{font-size:11px; color:var(--ink-3);}
  .tl-f{border-left-color:var(--blue) !important;}
  .tl-now{border-left-color:var(--accent) !important; color:var(--accent) !important; font-weight:500;}
  .tl-now .tl-date{color:var(--accent);}
  @media (max-width:560px){
    .tl-list li{grid-template-columns:76px 1fr;}
    .tl-kind{grid-column:2; }
    .tl-t{grid-column:1 / -1; padding-left:0;}
  }

  .score{display:grid; grid-template-columns:repeat(auto-fit, minmax(96px,1fr)); gap:1px;
         background:var(--line-soft); border:1px solid var(--line); border-radius:3px; overflow:hidden;}
  .sc{background:var(--panel); padding:14px 12px; text-align:center;}
  .sc b{display:block; font-family:"IBM Plex Mono", monospace; font-size:22px; color:var(--ink);
        font-variant-numeric:tabular-nums; line-height:1.2;}
  .sc span{font-size:11.5px; color:var(--ink-3);}

  a{color:var(--accent);}
  .nav{text-transform:none; letter-spacing:0; font-family:"Noto Sans SC", sans-serif; font-size:12px;}

  .wrap{max-width:min(920px, 100%);}

  .topbar .mini{position:relative;}
  .msug{position:absolute; left:0; right:0; top:calc(100% + 6px); z-index:20;
    display:flex; flex-direction:column; background:var(--panel);
    border-radius:8px; overflow:hidden; box-shadow:0 6px 20px rgba(0,0,0,.18);}
  .msug:empty{display:none;}
  .msug button{text-align:left; padding:10px 16px; border:none; border-bottom:1px solid var(--line-soft);
    background:transparent; color:var(--ink); font-size:14px; cursor:pointer; font-family:"Noto Sans SC",sans-serif;}
  .msug button:hover{background:var(--line-soft);}
  .msug button i{font-style:normal; color:var(--ink-3); font-size:12px; font-family:"IBM Plex Mono",monospace; margin-left:6px;}

  .stat{display:flex; align-items:center; gap:7px; padding:5px 11px; flex:none;
    background:var(--line-soft); border:1px solid var(--line); border-radius:999px;
    font-size:11.5px; color:var(--ink-3); line-height:1.5; white-space:nowrap;}
  .stat b{color:var(--ink); font-weight:500; font-family:"IBM Plex Mono",monospace;}
  .stat .dot{width:7px; height:7px; border-radius:50%; background:var(--green); flex:none;}
  @media (max-width:640px){
    .stat{order:4; flex-basis:100%; justify-content:center; border-radius:6px;}
  }
  @media (max-width:900px){ .stat .nx{display:none;} }
  .topbar .mini input{min-width:80px;}
  .topbar .mini{flex:1 1 140px; min-width:100px;}

  @media (max-width:1100px){
    .topbar{flex-wrap:wrap; row-gap:8px;}
    .topbar .brand{order:1;}
    .topbar .tnav{order:2; margin-left:auto;}
    .topbar .stat, .stat{order:3;}
    .topbar .mini{order:4; flex-basis:100%;}
  }
  @media (min-width:1101px){ .topbar{flex-wrap:nowrap;} }

  html, body{height:100%;}
  body{display:flex; flex-direction:column;}
  .bar{display:flex; justify-content:flex-end; align-items:center; gap:clamp(14px,2.4vw,26px);
       padding:16px clamp(16px,3vw,28px); font-size:13.5px;}
  .bar a{color:var(--ink-2); text-decoration:none;}
  .bar a:hover{color:var(--accent); text-decoration:underline;}
  .bar a.btn{background:var(--accent); color:#fff; padding:9px 20px; border-radius:999px; font-weight:500;}
  .bar a.btn:hover{opacity:.88; text-decoration:none; color:#fff;}
  main{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
       text-align:center; padding:clamp(40px,8vh,90px) 20px clamp(40px,10vh,110px); width:100%;}
  .mark{font-family:"IBM Plex Serif", Georgia, serif; font-weight:600;
        font-size:clamp(52px, 10vw, 104px); letter-spacing:-.025em; line-height:1;
        margin:0 0 6px; color:var(--ink);}
  .mark em{font-style:italic; font-weight:400; color:var(--accent);}
  .mark{margin-bottom:clamp(26px,4.5vh,44px);}
  .caveat{margin:14px auto 0; max-width:min(620px,100%); font-size:12px; line-height:1.8;
        color:var(--ink-3); font-weight:300; text-align:left; padding:0 6px;}
  .ask{display:flex; align-items:center; gap:12px; width:min(620px,100%);
        border:1px solid var(--line); background:var(--panel); border-radius:999px;
        padding:4px 6px 4px 20px; transition:box-shadow .15s, border-color .15s;}
  .ask:hover, .ask:focus-within{box-shadow:0 2px 14px rgba(0,0,0,.10); border-color:var(--line);}
  .ask svg{flex:none; width:19px; height:19px; stroke:var(--ink-3); fill:none; stroke-width:2;}
  .ask input{flex:1; min-width:0; border:none; outline:none; background:transparent; color:var(--ink);
        font-size:16px; padding:14px 0; font-family:"Noto Sans SC", sans-serif;}
  .ask input::placeholder{color:var(--ink-3); font-weight:300;}
  .acts{display:flex; flex-wrap:wrap; justify-content:center; gap:12px; margin-top:26px;}
  .acts button{font-family:"Noto Sans SC", sans-serif; font-size:14px; padding:11px 22px;
        border:1px solid transparent; border-radius:6px; cursor:pointer;
        background:var(--line-soft); color:var(--ink); transition:all .15s;}
  .acts button:hover{border-color:var(--line); box-shadow:0 1px 3px rgba(0,0,0,.08);}
  .tips{margin:clamp(26px,4.5vh,44px) 0 0; font-size:13px; color:var(--ink-3); font-weight:300;}
  .tips a{color:var(--accent); text-decoration:none; margin:0 7px; white-space:nowrap;}
  .tips a i{font-style:normal; font-size:11px; color:var(--ink-3); font-family:"IBM Plex Mono",monospace;}
  .muted{color:var(--ink-3);}
  .tips a:hover{text-decoration:underline;}
  .res{margin-top:20px; width:min(620px,100%); display:flex; flex-direction:column; gap:7px; text-align:left;}
  .res a{display:block; padding:13px 18px; background:var(--panel); border:1px solid var(--line);
        border-radius:10px; text-decoration:none; color:var(--ink); font-size:14.5px;}
  .res a:hover{border-color:var(--accent);}
  .res a span{color:var(--ink-3); font-size:12px; margin-left:10px; font-family:"IBM Plex Mono", monospace;}
  .pagefoot{background:var(--line-soft); border-top:1px solid var(--line);
        padding:16px clamp(16px,3vw,28px); font-size:12.5px; color:var(--ink-3); font-weight:300;
        display:flex; flex-wrap:wrap; gap:8px 20px; justify-content:space-between; align-items:center;}
  .pagefoot a{color:var(--ink-3); text-decoration:none; margin-right:18px;}
  .pagefoot a:hover{color:var(--accent); text-decoration:underline;}
  @media (max-width:520px){
    .bar{justify-content:center; gap:16px; font-size:13px;}
    .bar a.btn{padding:8px 16px;}
    .pagefoot{justify-content:center; text-align:center;}
  }
</style>
</head>
<body>
<main>
  <h1 class="mark">Sig<em>nal</em></h1>
  <div class="ask">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
    <input id="q" placeholder="输入 600520，看这只票在等哪个公告" autocomplete="off" aria-label="搜索">
  </div>
  <p class="caveat">机构成本是估算的：按它持股那个季度的量价均价算。季报滞后一到两个月，它可能早已离场。只能当参考，不是买入理由。</p>
  <div class="acts">
    <button id="go">查这只票</button>
    <button id="rnd">随便看一只</button>
  </div>
  <p class="tips" id="tips">常看的：<span class="muted">读取中…</span></p>
  <div class="res" id="res"></div>
</main>
<div class="pagefoot">
  <span>数据来自交易所公告、十大流通股东名册、龙虎榜　·　研究记录，不构成投资建议</span>
  <span>
    <a href="ledger.html">台账</a>
    <a href="pool.html">机构持仓池</a>
    <a href="tag.html">标签</a>
    <a href="seats.html">龙虎榜席位</a>
    <a href="stock.html">查一只票</a>
    <a href="https://github.com/wwfemg/signal/blob/main/docs/CONTRIBUTING.md">投稿规矩</a>
    <a href="https://github.com/wwfemg/signal/blob/main/docs/CHANGELOG.md">变更记录</a>
    <a href="https://github.com/wwfemg/signal/issues/new?template=feedback.yml">提意见</a>
    <a href="https://github.com/wwfemg/signal">GitHub</a>
    <span style="font-family:'IBM Plex Mono',monospace" id="upd">—</span>
  </span>
</div>
<script>
const esc = s => String(s ?? '').replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
const KEY = {'解禁':'解禁压力','外资':'外资扎堆','扎堆':'外资扎堆','成本':'低于机构估算成本','倒挂':'低于机构估算成本','低于':'低于机构估算成本',
  '龙虎榜':'龙虎榜常客','游资':'龙虎榜常客','拉升':'季末拉升'};
let NAMES = {}, CODES = [];
Promise.all(['data/names.json','data/tags.json'].map(u =>
  fetch(u, {cache:'no-store'}).then(r => r.ok ? r.json() : null).catch(() => null)))
  .then(([nm, tg]) => {
    if (nm) Object.assign(NAMES, nm);
    if (tg) { for (const [c, v] of Object.entries(tg.stocks)) { if (v.name) NAMES[c] = v.name; CODES.push(c); } }
  });
function ask(){
  const v = document.getElementById('q').value.trim();
  if (!v) return;
  if (/^[0-9]{6}$/.test(v)) { location.href = 'stock.html#' + v; return; }
  for (const k in KEY) if (v.includes(k)) { location.href = 'tag.html#' + encodeURIComponent(KEY[k]); return; }
  const hit = Object.entries(NAMES).filter(([c,n]) => n.includes(v)).slice(0,8);
  document.getElementById('res').innerHTML = hit.length
    ? hit.map(([c,n]) => `<a href="stock.html#${c}">${esc(n)}<span>${c}</span></a>`).join('')
    : `<a href="stock.html">没找到「${esc(v)}」，可以直接输 6 位代码<span>去查询页</span></a>`;
}
fetch('data/tags.json', {cache:'no-store'}).then(r => r.ok ? r.json() : null).then(d => {
  if (!d) return;
  const u = document.getElementById('upd'); if (u) u.textContent = '数据 ' + d.updated;
  const cnt = {};
  for (const v of Object.values(d.stocks)) for (const x of v.tags) cnt[x] = (cnt[x] || 0) + 1;
  const links = Object.keys(d.rules).filter(k => cnt[k])
    .map(k => `<a href="tag.html#${encodeURIComponent(k)}">${esc(k)} <i>${cnt[k]}</i></a>`).join('');
  if (links) document.getElementById('tips').innerHTML = '常看的：' + links;
}).catch(() => {});
document.getElementById('go').onclick = ask;
document.getElementById('rnd').onclick = () => {
  if (!CODES.length) { location.href = 'tag.html'; return; }
  location.href = 'stock.html#' + CODES[Math.floor(Math.random() * CODES.length)];
};
document.getElementById('q').onkeydown = e => { if (e.key === 'Enter') ask(); };
const HINTS = ['输入 600520，看这只票在等哪个公告',
  '输入 三佳，按名字找',
  '输入 解禁，看未来一年解禁压力大的票',
  '输入 龙虎榜，看近 30 天频繁上榜的票',
  '输入 外资扎堆，看同一季度多家通道账户同时出现的票',
  '输入 成本，看现价低于机构估算成本的票'];
(() => {
  const el = document.getElementById('q');
  let i = 0, stop = false;
  el.addEventListener('focus', () => { stop = true; el.placeholder = '股票代码、名字，或者一个逻辑'; });
  setInterval(() => { if (!stop) el.placeholder = HINTS[++i % HINTS.length]; }, 3800);
})();
</script>

<script>
// 右上角状态条：数据是哪天的、下次什么时候更新
(() => {
  const el = document.createElement('div');
  el.className = 'stat';
  el.innerHTML = '<span class="dot"></span><span>数据 <b id="stD">—</b></span><span class="nx" id="stN"></span>';
  const bar = document.querySelector('.topbar');
  if (bar) bar.appendChild(el); else document.body.insertBefore(el, document.body.firstChild);
  const bj = () => new Date(Date.now() + new Date().getTimezoneOffset()*60000 + 8*3600000);
  const nx = () => { const n = bj(), t = new Date(n); t.setHours(23,10,0,0);
    if (n > t) t.setDate(t.getDate()+1);
    while (t.getDay()===0 || t.getDay()===6) t.setDate(t.getDate()+1);
    return {t, ms: t - n}; };
  const tick = () => { const o = nx(); const h = Math.floor(o.ms/3600000), m = Math.floor(o.ms%3600000/60000);
    document.getElementById('stN').textContent =
      `· 下次 ${String(o.t.getHours()).padStart(2,'0')}:${String(o.t.getMinutes()).padStart(2,'0')}（${h>0?h+' 小时':''}${m} 分后）`; };
  tick(); setInterval(tick, 60000);
  fetch('data/status.json', {cache:'no-store'}).then(r => r.ok ? r.json() : null).then(d => {
    if (!d) return;
    document.getElementById('stD').textContent = d.updated;
    if (d.updated !== bj().toISOString().slice(0,10))
      document.querySelector('.stat .dot').style.background = 'var(--amber)';
  }).catch(() => {});
})();
</script>
</body>
</html>
